name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  release:
    name: merge reviewed build PR and publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out the immutable tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse missing, held, or stale review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_steward.py verify-tag "$GITHUB_REF_NAME" --repo .
      - name: Merge only the exact build PR through protected main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          head="build/v${version}"
          tag_sha="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          pr="$(gh pr list --state open --base main --head "$head" --json number,headRefOid,isDraft --jq '.[0]')"
          test -n "$pr" && test "$pr" != "null" || { echo "no open build PR for $head" >&2; exit 1; }
          test "$(jq -r .headRefOid <<<"$pr")" = "$tag_sha" || { echo "build PR does not name the tag commit" >&2; exit 1; }
          number="$(jq -r .number <<<"$pr")"
          release_train=""
          for attempt in $(seq 1 60); do
            release_train="$(gh api "repos/$GH_REPO/commits/$tag_sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "release-train" and .app.slug == "github-actions")] | sort_by(.started_at) | last // {} | [.status // "", .conclusion // ""] | @tsv')"
            status="${release_train%%$'\t'*}"
            conclusion="${release_train#*$'\t'}"
            if test "$status" = "completed"; then
              test "$conclusion" = "success" || { echo "release-train concluded $conclusion" >&2; exit 1; }
              break
            fi
            sleep 5
          done
          test "$release_train" = $'completed\tsuccess' || { echo "release-train did not report success within 5 minutes" >&2; exit 1; }
          if test "$(jq -r .isDraft <<<"$pr")" = "true"; then gh pr ready "$number"; fi
          gh pr merge "$number" --merge --match-head-commit "$tag_sha"
      - name: Publish the plain-language release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          page="docs/releases/$GITHUB_REF_NAME/RELEASE.md"
          test -f "$page" || { echo "$page is missing" >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$page" --latest
          else
            gh release create "$GITHUB_REF_NAME" --notes-file "$page" --verify-tag --latest
          fi
