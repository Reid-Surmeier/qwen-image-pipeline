<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">qwen-image-pipeline v0.3.0 governance map</title>
  <desc id="desc">One reusable tool repository serves application repositories that retain their assets and run evidence. Work flows from issues through one build line to a reviewed release tag.</desc>
  <rect width="1200" height="675" fill="#f6f7f9"/>
  <text x="70" y="76" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#172033">v0.3.0: one tool, application-owned work</text>
  <rect x="70" y="130" width="460" height="190" rx="18" fill="#172033"/>
  <text x="105" y="180" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white">qwen-image-pipeline</text>
  <text x="105" y="225" font-family="system-ui, sans-serif" font-size="20" fill="#d8e1f0">procedure · contracts · adapters</text>
  <text x="105" y="258" font-family="system-ui, sans-serif" font-size="20" fill="#d8e1f0">validation · provenance · learnings</text>
  <text x="105" y="294" font-family="system-ui, sans-serif" font-size="17" fill="#85d7ff">reusable tool repository</text>
  <path d="M550 225 H650" stroke="#62708a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="670" y="130" width="460" height="190" rx="18" fill="#ffffff" stroke="#77849c" stroke-width="3"/>
  <text x="705" y="180" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#172033">Application repositories</text>
  <text x="705" y="225" font-family="system-ui, sans-serif" font-size="20" fill="#36445d">references · assets · run records</text>
  <text x="705" y="258" font-family="system-ui, sans-serif" font-size="20" fill="#36445d">generations · Assembly · builds</text>
  <text x="705" y="294" font-family="system-ui, sans-serif" font-size="17" fill="#216e39">own and preserve every result</text>
  <text x="70" y="400" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#172033">Governed release path</text>
  <g font-family="system-ui, sans-serif" font-size="19" text-anchor="middle">
    <rect x="70" y="440" width="210" height="90" rx="14" fill="#e7eefb" stroke="#5d75a5" stroke-width="2"/>
    <text x="175" y="494" fill="#172033">Issue + acceptance</text>
    <path d="M295 485 H355" stroke="#62708a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="370" y="440" width="210" height="90" rx="14" fill="#e7eefb" stroke="#5d75a5" stroke-width="2"/>
    <text x="475" y="478" fill="#172033">build/v0.3.0</text>
    <text x="475" y="508" fill="#172033">+ draft build PR</text>
    <path d="M595 485 H655" stroke="#62708a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="670" y="440" width="210" height="90" rx="14" fill="#fff3cd" stroke="#b78918" stroke-width="2"/>
    <text x="775" y="478" fill="#172033">reviewed tag</text>
    <text x="775" y="508" fill="#7a5400">blocked by #19</text>
    <path d="M895 485 H955" stroke="#62708a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="970" y="440" width="160" height="90" rx="14" fill="#e5f6ea" stroke="#27864b" stroke-width="2"/>
    <text x="1050" y="478" fill="#172033">GitHub</text>
    <text x="1050" y="508" fill="#172033">Release</text>
  </g>
  <text x="70" y="610" font-family="system-ui, sans-serif" font-size="18" fill="#5b6578">Issue #18 opens the governed line. Ticket #19 must prove release enforcement before any tag or main update.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62708a"/>
    </marker>
  </defs>
</svg>
